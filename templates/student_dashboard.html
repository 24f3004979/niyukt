<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STUDENT DASHBOARD</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


  </head>
  <body>
  <div id="main-bar">
      <div id="search-bar">
        <a href="/logout" style="color : white; text-decoration: none;">LOGOUT</a>
          <input type="text" id="search-box">
          <button type="submit">search</button>
          <a href="http://127.0.0.1:8080/student" style="text-decoration: none; color:white">HOME</a>

      </div>
  </div>

  <section id="app">

  <aside id="control-units">
    <a id="user-btn" href='http://127.0.0.1:8080/student/'><img class="icon" src="{{ url_for('static', filename='icons/user.svg')}}" > </a>
    <a id="data-btn"><img class="icon" src="{{ url_for('static', filename='icons/history.svg')}}" > </a>
  </aside>

  <div id="main-content">
    <h1 style="color:azure"> Hey ! {{dashboard_information[0]}}</h1>
        <h1 class='display-1' style='color:white;'>STUDENT DASHBOARD</h1>
        <table class='table' id="dashboard-info">
          <tr>
            <th>
              Company Name
            </th>
            <th>
              Job Role 
            </th>
            <th>
              Discription
            </th>
            <th>
              Status
            </th>
            <th>
              Apply
            </th>
          </tr>
          {% for drive in drive_listing %}
            <tr>
              <td> {{ drive['company_name'] }} </td>
              <td> {{ drive['job_role'] }}</td>
              <td> {{ drive['discription'] }}</td>
              <td> {{ drive['status']  }}</td>
            <td><button id="{{ drive['drive_id'] }}" class="apply-btn" style="background-color: aquamarine;">{{ drive['student_status']}}</button></td>
            </tr>
          {% endfor %}
            
        </table>
  </div>

  </section>

    <script src="{{ url_for('static', filename='js/student_dashboard.js') }}"></script>
  </body>
</html>
