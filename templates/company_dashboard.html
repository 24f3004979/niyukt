<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COMPANY DASHBOARD</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  </head>
  <body>
  <div id="main-bar">
      
      <div id="search-bar">
        <a href="/logout" style="color : white; text-decoration: none;">LOGOUT</a>
          <a href= "http://127.0.0.1:8080/company/create-drive"><button id='create-drive-button'>create drive</button></a>
          <input type="text" id="search-box">
          <button type="submit">search</button>
          <a href="http://127.0.0.1:8080/company" style="text-decoration: none; color:white">HOME</a>
      </div>
  </div>

  <section id="app">

  <div id="main-content">
        <h1 class='display-1' style='color:white;'> <strong id='company_name'>COMPANY</strong>DASHBOARD</h1>
        <table  class="table" id="dashboard-info">
          <tr>
          <th>Job Role</th>
          <th>status</th>
          </tr>

          {% for drive in drives %}
            <tr>
            <td> <button class='drive-btn' id='{{drive[3]}}' style="background-color: rgb(117, 255, 255);"> {{drive[0]}} </button></td>
              <td> <strong>{{drive[2]}}</strong></td>
            </tr>
          {% endfor %}

        </table>
  </div>

  </section>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="{{ url_for('static', filename='js/company_dashboard.js') }}"></script>

  </body>
</html>
