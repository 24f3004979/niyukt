<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="{{ url_for('static', filename='css/form-styles.css') }}">
</head>
<body> 

  <form action="/login/verification" method="post">
    <div id="form-content">

      <strong><h1 style="color: aqua;">NIYUKT</h1></strong>

      <div id="name-input-box" class="input-box">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      </div>

      <div id='password-input-box' class="input-box">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      </div>

      <div id="button-section">
        <button type='submit' class="btn btn-primary" >LOG IN</button>

         <a href="\register\company" style="text-decoration: none; color : rgb(0, 0, 0); background-color:rgb(54, 4, 255)";> COMPANY </a>
        <a href="\register\student" style="text-decoration: none; color : rgb(0, 0, 0); background-color:bisque";> STUDENT </a>
      </div>


    </div>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
