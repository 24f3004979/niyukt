<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form-styles.css') }}">
</head>
<body>
  
  <form action="/register/login" method="post">
    <div id="form-content">

      <div id="name-input-box" class="input-box">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      </div>

      <div id='password-input-box' class="input-box">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      </div>

      <div id="button-section">
        <button id="submit-button" type='submit'>LOG IN</button>

        <a href="\register\student"> Log in </a>
      </div>


    </div>

</body>
</html>
