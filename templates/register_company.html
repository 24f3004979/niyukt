<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/form-styles.css') }}">
  <title>Company Register</title>
</head>
<body>


  <div id="form-content-box">
  <form action="/register/student" method="post">
    <div id="form-content">

    <div id="name-input-box" class="input-box">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div id="email-input-box" class="input-box">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </div>


    <div id='password-input-box' class="input-box">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div id="text-box" class="input-box">
      <label for="discription">About Company :</label>
      <textarea rows="4" cols="50" name="discription" id="discription" required></textarea>
    </div>
    <div id="button-section">
    <button id="submit-button" type='submit'>Submit</button>

    <a href="\login"> Log in </a>
    </div>
    </div>
  </form>

  </div>

</body>
</html>
